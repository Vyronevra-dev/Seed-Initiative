<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f5f0e0"/>
  <!-- Library/study room background -->
  <rect x="30" y="50" width="540" height="320" fill="#fff" rx="10"/>
  <rect x="30" y="50" width="540" height="60" fill="#2d5a4a"/>
  <text x="60" y="90" font-family="DM Sans, Arial, sans-serif" font-size="24" fill="#fff" font-weight="bold">Learning Hub</text>
  <!-- Bookshelf -->
  <rect x="480" y="120" width="80" height="250" fill="#8b5a2b"/>
  <rect x="485" y="130" width="70" height="20" fill="#d4a574"/>
  <rect x="485" y="160" width="70" height="20" fill="#d4a574"/>
  <rect x="485" y="190" width="70" height="20" fill="#d4a574"/>
  <rect x="485" y="220" width="70" height="20" fill="#d4a574"/>
  <rect x="485" y="250" width="70" height="20" fill="#d4a574"/>
  <rect x="485" y="280" width="70" height="20" fill="#d4a574"/>
  <!-- Study tables -->
  <rect x="60" y="130" width="200" height="40" fill="#ddd" rx="5"/>
  <rect x="60" y="190" width="200" height="40" fill="#ddd" rx="5"/>
  <rect x="60" y="250" width="200" height="40" fill="#ddd" rx="5"/>
  <!-- Students studying -->
  <circle cx="120" cy="145" r="7" fill="#2d5a4a"/>
  <rect x="115" y="150" width="12" height="20" fill="#2d5a4a"/>
  <rect x="120" y="150" width="18" height="4" fill="#fff"/>
  <!-- Student with notebook -->
  <circle cx="220" cy="205" r="7" fill="#4a7a6a"/>
  <rect x="215" y="210" width="12" height="20" fill="#4a7a6a"/>
  <rect x="218" y="212" width="16" height="4" fill="#fff"/>
  <!-- Student reading -->
  <circle cx="140" cy="265" r="7" fill="#7d9d7d"/>
  <rect x="135" y="270" width="12" height="20" fill="#7d9d7d"/>
  <!-- Laptop on table -->
  <rect x="300" y="200" width="60" height="40" fill="#333" rx="4"/>
  <rect x="305" y="205" width="50" height="30" fill="#87ceeb"/>
  <circle cx="320" cy="220" r="3" fill="#fff"/>
  <circle cx="330" cy="220" r="3" fill="#333"/>
  <!-- Group study -->
  <circle cx="420" cy="150" r="7" fill="#2d5a4a"/>
  <rect x="415" y="155" width="12" height="20" fill="#2d5a4a"/>
  <circle cx="440" cy="145" r="7" fill="#4a7a6a"/>
  <rect x="435" y="150" width="12" height="20" fill="#4a7a6a"/>
  <circle cx="460" cy="155" r="7" fill="#7d9d7d"/>
  <rect x="455" y="160" width="12" height="20" fill="#7d9d7d"/>
  <text x="300" y="390" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="14" fill="#555">Young people studying and learning together</text>
</svg>