<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#fef9e8"/>
  <!-- Certificate parchment -->
  <rect x="80" y="60" width="440" height="280" fill="#fef9e8" stroke="#d4ac0d" stroke-width="2" rx="5"/>
  <rect x="80" y="60" width="440" height="280" fill="none" stroke="#d4ac0d" stroke-width="1" stroke-dasharray="8"/>
  <!-- Seal -->
  <circle cx="300" cy="170" r="30" fill="none" stroke="#d4ac0d" stroke-width="2"/>
  <text x="300" y="175" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#5d4037">SEED</text>
  <text x="300" y="185" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#5d4037">INITIATIVE</text>
  <!-- Text on certificate -->
  <text x="300" y="220" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="20" fill="#2d5a4a" font-weight="bold">Certificate of Completion</text>
  <text x="300" y="250" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="14" fill="#5d4037">This certifies that</text>
  <text x="300" y="270" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="16" fill="#2d5a4a" font-weight="bold">[Participant Name]</text>
  <text x="300" y="290" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#5d4037">has successfully completed the Youth</text>
  <text x="300" y="305" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#5d4037">Leadership & Entrepreneurship Program</text>
  <text x="300" y="325" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#5d4037">Date: ____________</text>
  <!-- Signature lines -->
  <line x1="160" y1="350" x2="240" y2="350" stroke="#5d4037" stroke-width="1"/>
  <text x="200" y="360" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#5d4037">Program Director</text>
  <line x1="360" y1="350" x2="440" y2="350" stroke="#5d4037" stroke-width="1"/>
  <text x="400" y="360" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#5d4037">Executive Director</text>
  <!-- Celebrating figures -->
  <circle cx="120" cy="120" r="10" fill="#2d5a4a"/>
  <rect x="113" y="130" width="14" height="22" fill="#2d5a4a"/>
  <!-- Person celebrating -->
  <circle cx="480" cy="120" r="10" fill="#4a7a6a"/>
  <rect x="473" y="130" width="14" height="22" fill="#4a7a6a"/>
  <!-- Arms raised in celebration -->
  <line x1="473" y1="130" x2="465" y2="115" stroke="#4a7a6a" stroke-width="4" stroke-linecap="round"/>
  <line x1="487" y1="130" x2="495" y2="115" stroke="#4a7a6a" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="390" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="14" fill="#555">Young changemakers receiving certificates</text>
</svg>