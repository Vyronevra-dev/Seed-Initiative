<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#e8f0f2"/>
  <!-- Background buildings (informal settlement) -->
  <rect x="20" y="180" width="120" height="220" fill="#d4a574"/>
  <rect x="30" y="160" width="100" height="240" fill="#c9945a"/>
  <rect x="180" y="200" width="80" height="200" fill="#d4a574"/>
  <rect x="280" y="190" width="90" height="210" fill="#c9945a"/>
  <rect x="420" y="220" width="60" height="180" fill="#d4a574"/>
  <rect x="500" y="210" width="100" height="190" fill="#c9945a"/>
  <!-- Figures -->
  <circle cx="60" cy="140" r="12" fill="#2d5a4a"/>
  <circle cx="75" cy="135" r="12" fill="#4a7a6a"/>
  <circle cx="90" cy="140" r="12" fill="#7d9d7d"/>
  <!-- Person with phone -->
  <circle cx="220" cy="140" r="10" fill="#2d5a4a"/>
  <rect x="215" y="150" width="10" height="20" fill="#2d5a4a"/>
  <!-- Studying figure -->
  <circle cx="450" cy="150" r="10" fill="#2d5a4a"/>
  <rect x="445" y="160" width="22" height="16" fill="#8b5a2b" rx="3"/>
  <rect x="448" y="162" width="16" height="4" fill="#fff"/>
  <!-- Ground -->
  <rect y="400" width="600" height="40" fill="#8b7355"/>
  <text x="300" y="390" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="14" fill="#555">Youth in urban communities</text>
</svg>